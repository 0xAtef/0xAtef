name: Update contribution skyline

on:
  schedule:
    # Every Monday at 04:23 UTC.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contribution-skyline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the refresh script
        run: node --check scripts/profile.mjs

      - name: Fetch contributions and refresh both skyline images
        run: node scripts/profile.mjs

      - name: Commit updated skyline files if changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --check
          git add -- assets/contributions.json assets/contribution-skyline.svg assets/contribution-skyline-mobile.svg
          if git diff --cached --quiet; then
            echo "Skyline is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh contribution skyline"
          git push origin "HEAD:$DEFAULT_BRANCH"
